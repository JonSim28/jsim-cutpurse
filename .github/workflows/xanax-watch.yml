# Watches Xanax stock abroad around the clock (via YATA's public export) so Cutpurse's
# restock predictions keep learning while nobody has Torn open. Results go to the "data" branch.
# GitHub delays or skips scheduled jobs in quiet repos, so one run keeps watching for about
# 5h45m (a check every 2 minutes) and then starts the next run itself. The hourly schedule is
# only a backup that restarts it if the chain ever breaks.
name: Xanax stock watcher
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: xanax-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get the current data
        run: |
          git fetch --depth=1 origin data && git show origin/data:xanax.json > xanax.json || echo '{"c":{}}' > xanax.json
      - name: Watch for about 5h45m (a check every 2 minutes)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            if node tools/xanax-watch.js xanax.json; then
              rm -rf out && mkdir out && cp xanax.json out/
              ( cd out && git init -q -b data && git add xanax.json && git commit -qm "Xanax stock $(date -u +%FT%TZ)" \
                && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data ) || echo "push failed, will retry"
            fi
            sleep 120
          done
      - name: Start the next run
        if: always()
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/xanax-watch.yml/dispatches" -d '{"ref":"main"}'
